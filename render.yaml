# Render Blueprint for the backend. Deploy via the Render dashboard:
# New -> Blueprint -> connect this repo -> Render reads this file automatically.
# Env vars marked sync: false must be filled in manually in the Render
# dashboard after the service is created (never commit real secrets here).
#
# NOTE: the actual deployed service is currently named "reeya-kioski" (not
# "reeya-kioski-backend" below) at https://reeya-kioski.onrender.com — it was
# set up manually rather than via this Blueprint.
#
# Embeddings are now a hosted Gemini API call (app/services/embeddings.py),
# not an in-process torch/transformers model — the Free plan's 512MB is
# enough now. (This service previously crashed with OOM errors on Free under
# the old local-CLIP setup; that's specifically what this swap fixed.)
services:
  - type: web
    name: reeya-kioski-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: EMBEDDING_MODEL_NAME
        value: gemini-embedding-2-preview
      - key: GEMINI_API_KEY
        sync: false
      - key: PRESIGN_EXPIRY_SECONDS
        value: "300"
      - key: PRODUCT_API_URL
        sync: false
      - key: PRODUCT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false  # e.g. https://your-frontend.vercel.app,http://localhost:5173
      - key: ALLOWED_ORIGIN_REGEX
        value: '^https://.*\.vercel\.app$'  # matches Vercel preview deployments too
